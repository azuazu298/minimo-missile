<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>minimo-missile 通信テスト</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #0b0d11; color: #eef0f3;
    font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px;
  }
  h2 { margin-bottom: 4px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  input {
    font-size: 16px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.15); background: #14171d; color: #eef0f3;
  }
  button {
    font-size: 15px; padding: 10px 16px; border-radius: 8px; border: none;
    background: #5fd4e0; color: #0b0d11; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .5; }
  #status { margin-top: 10px; font-size: 13px; color: #9aa0a8; }
  #arena {
    width: min(90vw, 420px); height: 300px; background: #14171d;
    border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
    position: relative; margin-top: 18px; overflow: hidden;
  }
  .dot { width: 22px; height: 22px; border-radius: 50%; position: absolute; transition: left .05s linear, top .05s linear; }
  #me { background: #ff5a4e; }
  #peer { background: #35c8e8; display: none; }
  p.help { max-width: 420px; font-size: 13px; color: #9aa0a8; line-height: 1.6; text-align: center; }
</style>
</head>
<body>
  <h2>合言葉テスト</h2>
  <div class="row">
    <input id="code" placeholder="合言葉を入力" />
    <button id="join">接続</button>
  </div>
  <div id="status">未接続</div>

  <div id="arena">
    <div id="me" class="dot" style="left:10px; top:10px;"></div>
    <div id="peer" class="dot" style="left:370px; top:270px;"></div>
  </div>

  <p class="help">
    同じ合言葉を2つのブラウザ（別タブ・別端末どちらでもOK）で入力して「接続」すると、マッチングします。<br />
    矢印キーで自分（赤）を動かすと、相手の画面の青い丸にリアルタイムで反映されます。
  </p>

<script>
  // ローカルで試すときは ws://localhost:8787
  // Renderにデプロイしたら wss://＜あなたのサービス名＞.onrender.com に書き換えます
const SERVER_URL = "wss://minimo-missile-server.onrender.com";

  let ws = null;
  let me = { x: 10, y: 10 };
  let matched = false;

  const statusEl = document.getElementById("status");
  const meEl = document.getElementById("me");
  const peerEl = document.getElementById("peer");
  const joinBtn = document.getElementById("join");
  const codeInput = document.getElementById("code");

  joinBtn.onclick = () => {
    const code = codeInput.value.trim();
    if (!code) return;
    joinBtn.disabled = true;
    codeInput.disabled = true;

    ws = new WebSocket(SERVER_URL);

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: "join", code }));
      statusEl.textContent = "相手を待っています…";
    };

    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === "matched") {
        matched = true;
        statusEl.textContent = "マッチ成立！矢印キーで動かしてみてください";
        peerEl.style.display = "block";
      } else if (msg.type === "state") {
        peerEl.style.left = msg.payload.x + "px";
        peerEl.style.top = msg.payload.y + "px";
      } else if (msg.type === "peer-left") {
        statusEl.textContent = "相手が切断しました";
        peerEl.style.display = "none";
        matched = false;
      } else if (msg.type === "full") {
        statusEl.textContent = "その合言葉はすでに2人います";
      }
    };

    ws.onclose = () => {
      if (statusEl.textContent === "相手を待っています…") {
        statusEl.textContent = "サーバーに接続できませんでした";
      }
    };
  };

  window.addEventListener("keydown", (e) => {
    if (!matched) return;
    const step = 10;
    if (e.key === "ArrowUp") me.y = Math.max(0, me.y - step);
    if (e.key === "ArrowDown") me.y = Math.min(278, me.y + step);
    if (e.key === "ArrowLeft") me.x = Math.max(0, me.x - step);
    if (e.key === "ArrowRight") me.x = Math.min(390, me.x + step);
    meEl.style.left = me.x + "px";
    meEl.style.top = me.y + "px";
    ws.send(JSON.stringify({ type: "state", payload: me }));
  });
</script>
</body>
</html>
